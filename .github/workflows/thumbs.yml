name: 썸네일

# img/ 에 webp 를 올리면 img/thumb/ 에 목록용 축소본을 만들어 되커밋한다.
# 만드는 도구는 코드 저장소(myth-atelier)의 tools/make-thumbs.py 다 — 여기 복사해 두지
# 않고 그때그때 받아 온다. 등록(data/img.json)은 코드 저장소의 워크플로가 한다.
# 되커밋에는 [skip actions] 를 붙여 이 워크플로가 다시 돌지 않게 한다.
# 끝나면 코드 저장소의 "그림 등록" 을 깨운다 — 저장소 비밀 CODE_REPO_TOKEN 이 있을 때만.
# 토큰이 없으면 코드 저장소는 시간표(자주 빠진다)나 Run workflow 로 등록한다.
on:
  push:
    branches: [main]
    paths:
      - 'img/*.webp'
  workflow_dispatch:

# 연달아 올리면 차례로 돈다. 두 실행이 같은 파일을 밀면 푸시가 깨진다
concurrency:
  group: thumbs
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  thumbs:
    runs-on: ubuntu-latest
    steps:
      # 되커밋이 밀렸을 때 rebase 를 하므로 온전한 이력이 필요하다
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/checkout@v4
        with:
          repository: polos0117/myth-atelier
          path: code

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Pillow 설치
        run: pip install --quiet Pillow

      # 체크아웃은 모든 파일의 시각이 같아서 "덮어쓴 원본" 을 시각으로는 못 알아본다.
      # 이번 푸시에서 달라진 webp 를 --redo 로 넘겨 그것은 무조건 다시 만든다
      - name: 썸네일
        run: |
          CHANGED=""
          if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            CHANGED=$(git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" -- 'img/*.webp' | tr '\n' ' ')
          fi
          echo "다시 만들 것: ${CHANGED:-없음}"
          python3 code/tools/make-thumbs.py --redo $CHANGED

      - name: 되커밋
        run: |
          if [ -z "$(git status --porcelain -- img/thumb)" ]; then
            echo "달라진 것 없음 — 커밋하지 않는다"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add img/thumb
          git commit -m "자동 썸네일 [skip actions]"
          # 사이에 다른 커밋이 들어왔으면 얹어서 다시 민다
          for i in 1 2 3; do
            git push && exit 0
            git pull --rebase origin main || exit 1
          done
          exit 1

      # 코드 저장소는 여기 푸시를 볼 수 없다. 토큰으로 직접 두드린다.
      # 토큰: github.com → Settings → Developer settings → Fine-grained tokens,
      #   저장소 pkm-atelier 하나, Contents: Read and write. 그것을 이 저장소의
      #   Settings → Secrets and variables → Actions 에 CODE_REPO_TOKEN 으로 넣는다.
      - name: 코드 저장소 깨우기
        if: ${{ !cancelled() }}
        env:
          TOKEN: ${{ secrets.CODE_REPO_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "CODE_REPO_TOKEN 이 없다 — 코드 저장소는 시간표나 Run workflow 로 등록한다"
            exit 0
          fi
          curl -sS --fail -X POST \
            -H "Authorization: Bearer $TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/polos0117/myth-atelier/dispatches \
            -d '{"event_type":"images-updated"}'
          echo "깨웠다 — pkm-atelier 의 그림 등록 이 곧 돈다"
